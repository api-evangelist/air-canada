aid: air-canada
name: Air Canada
review:
  question: >-
    Does Air Canada publish a real, reachable API surface, and what would it
    cost a customer of that surface to leave?
  answer: true
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: airline
  homeMarket: Canada
  summary: |
    Air Canada publishes a genuine, unauthenticated developer portal at
    ndc.aircanada.com covering ten IATA NDC 17.2 (EDIST) message pairs, with
    element-level request/response tables, error-code catalogues, use cases,
    orchestration guidance, a public roadmap, release notes, a status page and
    downloadable sample XML. That is far more than most flag carriers publish.
    What it does not publish is a machine-readable contract (no OpenAPI, no
    WSDL, no XSD download), a consumer API (no flight status, check-in or
    Aeroplan endpoint), or any way to get in without a signed commercial
    agreement. Two distinct surfaces were checked and are not conflated below:
    the CONSUMER surface (none published) and the DISTRIBUTION surface
    (documented, gated).
surfaces:
  consumer:
    publicAPI: false
    note: >-
      No public consumer API. developer.aircanada.com and developers.aircanada.com
      do not resolve; api.aircanada.com returns 403 at root with no documentation
      behind it; www.aircanada.com/developers, /api, /openapi.json and
      /swagger.json all return 404. developer.aeroplan.com and api.aeroplan.com
      do not resolve. Flight status, check-in, booking and Aeroplan are
      web/app-only.
  distribution:
    publicDocs: true
    portal: https://ndc.aircanada.com/
    standard: IATA NDC 17.2 (EDIST), XML over SOAP envelope
    note: >-
      Documentation is served by a React SPA whose content is embedded in the
      client bundle, so every documentation route returns HTTP 200 with the SPA
      shell and the prose renders client-side. No login, cookie or key is
      required to read it.
