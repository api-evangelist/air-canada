description: >-
  Air Canada publishes no /.well-known/ discovery surface on any of its API or
  documentation hosts. This file records the probe so the absence is evidence
  rather than a gap in the research. Two of the three hosts return misleading
  200s: ndc.aircanada.com is a React single-page app whose server answers every
  unknown path with the SPA shell (text/html), so /.well-known/security.txt,
  /llms.txt and /.well-known/openid-configuration all "succeed" with an HTML
  document that is not the requested resource. No pointer is wired into
  apis.yml for this artifact because there is nothing discoverable to point at.
