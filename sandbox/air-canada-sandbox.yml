fixtures:
  sample_messages: examples/
  index: examples/_index.yml
  note: >-
    Air Canada publishes 100+ downloadable request/response XML samples covering
    six use cases and five end-to-end scenarios. The small ones are committed to
    examples/; the multi-megabyte AirShopping and SeatAvailability responses are
    indexed by URL.

not_published:
  - Test clocks or time simulation
  - Fixture/trigger tooling to force a specific error or decline
  - Self-service sandbox credentials
  - A test-mode key prefix or mode flag
