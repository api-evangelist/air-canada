generated: '2026-07-28'
method: searched
source: >-
  https://ndc.aircanada.com/api/documentation/ndcapis - the per-service "Error Codes"
  pages of the Air Canada NDC developer portal. The portal is a React SPA that serves
  its documentation from the client bundle
  (https://ndc.aircanada.com/static/js/main.c265d76f.js); the tables below were read
  from that published bundle verbatim on 2026-07-28. Nothing is inferred.
format: iata-ndc-edist-error-element
description: >-
  Air Canada NDC does not use HTTP problem details. Business and technical failures are
  returned inside the IATA NDC 17.2 message itself, in the Errors element (a collection
  of errors that occurred during the processing of a message), carrying a numeric Code
  and a text message. Codes are NOT namespaced per service - the same numeric code
  appears on several message services, and the low-numbered 1xxx-3xxxx codes are
  Amadeus host errors surfaced through the NDC layer (the record-locator errors name
  the 1A system explicitly), while the 89xxx/99xxx/199xxx codes are Air Canada NDC
  platform codes.
envelope:
  element: Errors/Error
  attributes: [Code, ShortText, Type, Owner]
  note: >-
    Errors are carried in the NDC response payload (inside the CDATA IATA_NDC_Message),
    not in the HTTP status line. A missing or invalid apikey is the documented
    exception - Air Canada states that produces an HTTP 400 Bad Request.
ranges:
  - range: 1000-36999
    origin: Amadeus (1A) host / PNR, ticketing and EMD errors surfaced through NDC
  - range: 89000-89999
    origin: Air Canada NDC platform - fare/offer warnings, several documented as ignorable
  - range: 99000-99999
    origin: Air Canada NDC platform - offer, order and transformation errors
  - range: 199000-199999
    origin: Air Canada NDC platform - seller authentication / accreditation errors
