method: searched
source: >-
  https://ndc.aircanada.com/api/documentation/ordercreate/errorcodes - the "Payment
  Authorization - Error Codes" table published on the Air Canada NDC OrderCreate error
  reference, read verbatim from the portal's published client bundle on 2026-07-28.
description: >-
  Air Canada takes form-of-payment on OrderCreateRQ and OrderChangeRQ (both routed
  through the aps-gw PCI gateway rather than the ipg-gw shopping gateway), so the NDC
  surface carries a real card-authorization decline table. These codes are the
  Amadeus/host authorization responses surfaced through the NDC Errors element - they
  complement, and do not replace, errors/air-canada-error-codes.yml.
envelope:
  element: Errors/Error
  returned_on: [OrderCreateRQ -> OrderViewRS, OrderChangeRQ -> OrderViewRS]
  gateway: https://ndcpartners.aircanada.com/aps-gw/ndc/17.2/v1/OrderCreate
masking:
  published: false
  note: >-
    Air Canada does not publish which decline reasons may be shown to a traveller and
    which must be masked. Several messages are written as agent instructions ("CALL TO
    AUTHORISE", "PICKUP CARD") and are plainly not buyer-facing, but that is an
    observation, not a published rule.
