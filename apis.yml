aid: air-canada
url: https://raw.githubusercontent.com/api-evangelist/air-canada/refs/heads/main/apis.yml
name: Air Canada
kind: company
description: >-
  Air Canada is Canada's flag carrier and largest airline, headquartered in
  Montreal, operating scheduled passenger service under the AC designator along
  with Air Canada Rouge, Air Canada Express and the Aeroplan loyalty programme.
  Its home market is Canada, where it forms a duopoly with WestJet. Air Canada
  sits at the supply end of the travel distribution chain: it is the sole source
  of its own seat inventory, reached either through the legacy GDS EDIFACT
  channel (Amadeus, Sabre, Travelport), through certified NDC aggregators, or
  directly through its own NDC API. Its API posture is unusual for a carrier in
  that the distribution surface is genuinely well documented in public: the
  ndc.aircanada.com developer portal publishes complete IATA NDC 17.2 (EDIST)
  message documentation, request/response element tables, error catalogues, use
  cases and downloadable sample XML with no login. What is not public is access
  itself - production credentials require a commercial agreement with Air
  Canada's distribution team, accredited IATA/ARC codes passed on every request,
  and passing Air Canada display certification test cases. There is no consumer
  API (no public flight status, booking or Aeroplan endpoint), no OpenAPI or
  machine-readable contract, no bulk export operation, and Air Canada publishes
  that it may revoke NDC programme access at its sole discretion. Public docs,
  gated access, no exit path.
