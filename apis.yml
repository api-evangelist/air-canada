apis:
- aid: air-canada:air-canada-ndc-airshopping-api
  name: Air Canada NDC AirShopping API
  description: >-
    IATA NDC 17.2 AirShopping message pair (AirShoppingRQ / AirShoppingRS).
    Shops one-way, round-trip and North America multicity itineraries and
    returns branded fare-family offers with per-passenger price breakdowns,
    calendar offers and flight details. Requires agent IATA number and Agency ID
    for agency flows, or Point of Sale for direct consumer flows.
  humanURL: https://ndc.aircanada.com/api/documentation/airshopping
  baseURL: https://ndcpartners.aircanada.com
  tags:
  - NDC
  - Shopping
  - Offers
  properties:
  - type: Documentation
    url: https://ndc.aircanada.com/api/documentation/airshopping
  - type: APIReference
    url: https://ndc.aircanada.com/api/documentation/ndcapis
  - type: GettingStarted
    url: https://ndc.aircanada.com/api/gettingstarted/gettingstarted
  - type: Specification
    url: https://www.iata.org/en/programs/airline-distribution/retailing/ndc/
- aid: air-canada:air-canada-ndc-offerprice-api
  name: Air Canada NDC OfferPrice API
  description: >-
    IATA NDC 17.2 OfferPrice message pair (OfferPriceRQ / OfferPriceRS).
    Returns detailed and comprehensive pricing for a selected offer, including
    base fare, tax breakdown, surcharges and fare rules, for presentation on the
    review page required by Air Canada's display requirements.
  humanURL: https://ndc.aircanada.com/api/documentation/offerprice
  baseURL: https://ndcpartners.aircanada.com
  tags:
  - NDC
  - Pricing
  - Offers
  properties:
  - type: Documentation
    url: https://ndc.aircanada.com/api/documentation/offerprice
  - type: APIReference
    url: https://ndc.aircanada.com/api/documentation/ndcapis
- aid: air-canada:air-canada-ndc-servicelist-api
  name: Air Canada NDC ServiceList API
  description: >-
    IATA NDC 17.2 ServiceList message pair (ServiceListRQ / ServiceListRS).
    Returns the optional and ancillary services purchasable against an offer or
    order, such as Maple Leaf Lounge access and Air Canada Bistro meal vouchers.
  humanURL: https://ndc.aircanada.com/api/documentation/servicelist
  baseURL: https://ndcpartners.aircanada.com
  tags:
  - NDC
  - Ancillaries
  - Services
  properties:
  - type: Documentation
    url: https://ndc.aircanada.com/api/documentation/servicelist
  - type: APIReference
    url: https://ndc.aircanada.com/api/documentation/ndcapis
- aid: air-canada:air-canada-ndc-seatavailability-api
  name: Air Canada NDC SeatAvailability API
  description: >-
    IATA NDC 17.2 SeatAvailability message pair (SeatAvailabilityRQ /
    SeatAvailabilityRS). Returns seat maps with advance and preferred seat
    pricing, either during a booking flow against an OfferID or after an Order
    has been created against an OrderID.
  humanURL: https://ndc.aircanada.com/api/documentation/seatavailability
  baseURL: https://ndcpartners.aircanada.com
  tags:
  - NDC
  - Seats
  - Ancillaries
  properties:
  - type: Documentation
    url: https://ndc.aircanada.com/api/documentation/seatavailability
  - type: APIReference
    url: https://ndc.aircanada.com/api/documentation/ndcapis
- aid: air-canada:air-canada-ndc-ordercreate-api
  name: Air Canada NDC OrderCreate API
  description: >-
    IATA NDC 17.2 OrderCreate message pair (OrderCreateRQ / OrderViewRS).
    Creates an actual reservation and returns an airline-assigned OrderID plus
    an Air Canada record locator and associated reservation details. Payment,
    passenger and form-of-payment detail is carried on the request.
  humanURL: https://ndc.aircanada.com/api/documentation/ordercreate
  baseURL: https://ndcpartners.aircanada.com
  tags:
  - NDC
  - Orders
  - Booking
  properties:
  - type: Documentation
    url: https://ndc.aircanada.com/api/documentation/ordercreate
  - type: APIReference
    url: https://ndc.aircanada.com/api/documentation/ndcapis
- aid: air-canada:air-canada-ndc-orderretrieve-api
  name: Air Canada NDC OrderRetrieve API
  description: >-
    IATA NDC 17.2 OrderRetrieve message pair (OrderRetrieveRQ / OrderViewRS).
    Retrieves a single Order by mandatory OrderID and Owner. Air Canada
    documents that retrieving a cancelled Order, a GDS booking, a redemption
    booking, or the modification history of an Order is not supported, and that
    filtering to specific sections of Order data is not supported.
  humanURL: https://ndc.aircanada.com/api/documentation/orderretrieve
  baseURL: https://ndcpartners.aircanada.com
  tags:
  - NDC
  - Orders
  - Servicing
  properties:
  - type: Documentation
    url: https://ndc.aircanada.com/api/documentation/orderretrieve
  - type: APIReference
    url: https://ndc.aircanada.com/api/documentation/ndcapis
- aid: air-canada:air-canada-ndc-orderchange-api
  name: Air Canada NDC OrderChange API
  description: >-
    IATA NDC 17.2 OrderChange message pair (OrderChangeRQ / OrderViewRS).
    Applies servicing changes to an existing Order, including seat and ancillary
    servicing with or without itinerary change, passenger servicing and
    frequent-flyer updates.
