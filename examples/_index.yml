description: >-
  Air Canada publishes downloadable request and response XML for every documented
  NDC 17.2 message, covering six use cases and five end-to-end booking scenarios,
  with no login. These are the only machine-readable artifacts Air Canada ships -
  there is no OpenAPI, WSDL or XSD - so they are the ground truth for the wire
  format. Every file listed here was fetched from ndc.aircanada.com on 2026-07-28
  and returned HTTP 200 with content-type text/xml. Files at or below 120 KB are
  committed to this directory verbatim; the multi-megabyte AirShopping and
  SeatAvailability responses are indexed by URL instead of committed.
note: >-
  SellerID is masked with asterisks in Air Canada's own published samples. The only
  card number appearing in the committed files is Air Canada's published test card
  4012999999999999.
